<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 포토존 갤러리</title>
    <link rel="stylesheet" href="style.css"> <!-- 스타일링 연결 -->
</head>
<body>
    <header>
        <h1>전국 포토존 갤러리</h1>
    </header>

    <main>
        <!-- 사진 업로드 폼 -->
        <section class="upload-form">
            <h2>사진 업로드</h2>
            <form action="#" method="POST" enctype="multipart/form-data">
                <!-- 지역 선택 -->
                <label for="region">지역 선택:</label>
                <select id="region" name="region" required>
                    <option value="서울">서울</option>
                    <option value="부산">부산</option>
                    <option value="대구">대구</option>
                    <option value="광주">광주</option>
                    <option value="대전">대전</option>
                    <option value="울산">울산</option>
                    <option value="경기">경기</option>
                    <option value="강원">강원</option>
                    <option value="충북">충북</option>
                    <option value="충남">충남</option>
                    <option value="전북">전북</option>
                    <option value="전남">전남</option>
                    <option value="경북">경북</option>
                    <option value="경남">경남</option>
                    <option value="제주">제주</option>
                    <option value="세종">세종</option>
                    <option value="인천">인천</option>
                    <option value="특별시">특별시</option>
                </select>

                <!-- 사진 업로드 -->
                <label for="photos">사진 업로드 (최대 5장):</label>
                <input type="file" id="photos" name="photos[]" accept="image/*" multiple required>

                <!-- 설명 입력 -->
                <label for="description">사진 설명:</label>
                <input type="text" id="description" name="description" required>

                <!-- 시간 입력 -->
                <label for="time">촬영 시간:</label>
                <input type="datetime-local" id="time" name="time" required>

                <!-- 장소 입력 -->
                <label for="location">촬영 장소:</label>
                <input type="text" id="location" name="location" required>

                <!-- 저작권 입력 -->
                <label for="copyright">저작권:</label>
                <input type="text" id="copyright" name="copyright" required>

                <!-- 제출 버튼 -->
                <button type="submit">업로드</button>
            </form>
        </section>

        <!-- 전국 포토존 갤러리 -->
        <section class="gallery">
            <div class="photo-category">
                <h3>서울</h3>
                <img src="seoul1.jpg" alt="서울 포토존">
                <img src="seoul2.jpg" alt="서울 포토존">
            </div>
            <div class="photo-category">
                <h3>부산</h3>
                <img src="busan1.jpg" alt="부산 포토존">
                <img src="busan2.jpg" alt="부산 포토존">
            </div>
            <!-- 다른 지역도 마찬가지로 추가 -->
        </section>
    </main>

    <footer>
        <p>&copy; 2025 전국 포토존</p>
    </footer>
</body>
</html>
